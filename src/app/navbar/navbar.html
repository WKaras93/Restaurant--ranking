<header class="flex h-12 md:h-16 w-full items-center justify-between border-b border-border px-4 md:px-6">
  <div class="flex items-center">
    <h1 class="font-extrabold font-display text-xl md:text-2xl">Testemap.</h1>
  </div>

  <div class="flex items-center gap-2 md:gap-3">
    <!-- search input: tablet and up -->
    <input placeholder="Search your places" class="search-place-input hidden md:block bg-bg-tertiary hover:bg-primary-hover border border-gray-300 px-3 py-1 rounded-xl hover:text-text-hover" />

    <!-- search icon: mobile only-->
    <button
      aria-label="Search places"
      class="group rounded-full action-mobile-button border border-gray-300 hover:bg-primary-hover md:hidden"
      (click)="isSearchOpen = true"
      >
      <mat-icon class="transition-colors group-hover:!text-text-hover">search</mat-icon>
    </button>

    <!-- dark mode toggle-->
    <button class="group rounded-full action-desktop-button hidden border border-gray-300 hover:bg-primary-hover">
      <mat-icon class="transition-colors group-hover:!text-text-hover">nightlight</mat-icon>
    </button>
    
    <!-- refresh button-->
    <button class="group rounded-full action-desktop-button hidden border border-gray-300 hover:bg-primary-hover">
      <mat-icon class="transition-colors group-hover:!text-text-hover">refresh</mat-icon>
    </button>

    <button class="group rounded-full navbar-action-button border border-gray-300 hover:bg-primary-hover">
      <mat-icon class="transition-colors group-hover:!text-text-hover">{{isLogined ? 'account_circle' : 'person'}}</mat-icon>
    </button>
    
    <ng-container *ngIf="isLogined">
      <button class="group bg-primary-hover hover:bg-bg-tertiary border border-gray-300 px-3 py-1 h-10 rounded-xl text-text-hover flex flex-row items-center">
        <mat-icon class="transition-colors group-hover:!text-text-primary">add</mat-icon>
        <p class="group-hover:!text-text-primary">Add a place</p>
      </button>
    </ng-container>
  </div>
</header>
